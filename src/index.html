<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluyt demo - hear the engines</title>
<meta name="description" content="A browser preview of Fluyt's nine sound engines for the KORG drumlogue, playing a short tune.">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>

<h1>Fluyt demo - hear the engines</h1>

<div class="transport">
    <button id="play" type="button">Play</button>
    <button id="random" class="secondary" type="button"
            title="Put a different engine across the bass, the lead and the chords">Random</button>
    <span class="status" id="transport-status"></span>
</div>

<div id="parts"></div>

<footer>
    <p id="error" class="rate-warning"></p>
    <p id="rate-note" class="rate-warning"></p>
    <p>Engines: Felucca © Hügelton Instruments, GPL-3.0 ·
       <a href="https://github.com/rgrvmusic/fluyt-logue">source</a> · page MIT ·
       <a href="keyboard.html">play with a keyboard or MIDI →</a></p>
</footer>

<script type="module" src="js/iframe-app.js"></script>
</body>
</html>
